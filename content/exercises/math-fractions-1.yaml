id: math-fractions-1
title: Adding Fractions
kind: numeric
skills: [fractions]
difficulty: 2
prompt: |
  What is 1/2 + 1/3? Enter your answer as a fraction (like 5/6) or a decimal.
answer: "5/6"
tolerance: 0.001
hints:
  - Find a common denominator first.
  - 1/2 = 3/6 and 1/3 = 2/6.
explanation: 1/2 + 1/3 = 3/6 + 2/6 = 5/6 (about 0.8333).
