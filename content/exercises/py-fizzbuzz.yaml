id: py-fizzbuzz
title: FizzBuzz
skills: [loops, conditionals]
difficulty: 2
prompt: |
  Print the first `n` numbers, replacing multiples of 3 with `Fizz` and
  multiples of 5 with `Buzz`. Numbers divisible by both 15 print `FizzBuzz`
  and nothing else.

  Rules:
  - Read `n` from standard input.
  - Print one line per number, counting from 1 through n.
  - Divisibility by 15 must be checked before divisibility by 3 or 5, or
    every fifteenth number comes out as `Fizz` or `Buzz` instead.

  The starter counts correctly but ignores every rule.
hints:
  - "Build the line in a variable, then append Fizz / Buzz / FizzBuzz, and print it once at the end of the loop body."
  - "Check i % 15 first, then i % 3, then i % 5."
starter: |
  n = int(input())
  for i in range(1, n + 1):
      print(i)
solution: |
  n = int(input())
  for i in range(1, n + 1):
      if i % 15 == 0:
          print("FizzBuzz")
      elif i % 3 == 0:
          print("Fizz")
      elif i % 5 == 0:
          print("Buzz")
      else:
          print(i)
tests:
  - input: "5\n"
    expected: |
      1
      2
      Fizz
      4
      Buzz
    hidden: false
  - input: "3\n"
    expected: |
      1
      2
      Fizz
    hidden: false
  - input: "15\n"
    expected: |
      1
      2
      Fizz
      4
      Buzz
      Fizz
      7
      8
      Fizz
      Buzz
      11
      Fizz
      13
      14
      FizzBuzz
    hidden: true
  - input: "1\n"
    expected: "1"
    hidden: true
