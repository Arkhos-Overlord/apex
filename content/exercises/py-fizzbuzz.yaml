id: py-fizzbuzz
title: FizzBuzz
skills: [loops, conditionals]
difficulty: 2
prompt: |
  Read an integer n. For each number 1..n print "Fizz" if divisible by 3,
  "Buzz" if divisible by 5, "FizzBuzz" if both, otherwise the number.
starter: |
  n = int(input())
  for i in range(1, n + 1):
      pass
tests:
  - input: "5\n"
    expected: "1\n2\nFizz\n4\nBuzz\n"
    hidden: false
  - input: "15\n"
    expected: "1\n2\nFizz\n4\nBuzz\nFizz\n7\n8\nFizz\nBuzz\n11\nFizz\n13\n14\nFizzBuzz\n"
    hidden: true
  - input: "0\n"
    expected: ""
    hidden: true
