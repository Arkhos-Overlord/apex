[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-edu"
version = "0.1.0"
description = "APEX - AI-Powered eXperiential Education: A standalone teaching platform"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fpdf2>=2.7",
    "reportlab>=4.0",
]

[project.scripts]
apex = "apex.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["apex*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
strict = true

[tool.pytest.ini_options]
testpaths = ['apex/tests']
asyncio_mode = 'auto'
