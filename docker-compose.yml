version: '3.8'

services:
  apex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex-edu
    ports:
      - "8080:8080"
    volumes:
      # Persist SQLite database
      - apex-data:/data
      # Hot-reload content exercises
      - ./content:/app/content
      # Persist learner progress
      - apex-sessions:/app/apex/sessions
    environment:
      - APEX_DB=/data/apex.db
      - APEX_CONTENT_DIR=/app/content
      - APEX_TIMEOUT_S=30
      - APEX_MEMORY_MB=256
      - HERMES_TTS_AVAILABLE=${HERMES_TTS_AVAILABLE:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  apex-data:
  apex-sessions:
